name: Observable Universe CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  web-validation:
    name: Web Assets & Manifest Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Validate Core Files
        run: |
          test -f universe-web/index.html
          test -f universe-web/styles.css
          test -f universe-web/app.js
          test -f README.md
          test -f LICENSE
          echo "Observable Universe web assets verified."
        shell: bash
